<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table tag</title>
    <style>
        table,th,td{
            border:2px solid palevioletred;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Month</th>
            <th>Salary</th>
        </tr>
        <tr>
            <td>Janauary</td>
            <td>100000</td>
        </tr>
        <tr>
            <td>February</td>
            <td>3000000</td>
        </tr>
    </table>
</body>
</html>
